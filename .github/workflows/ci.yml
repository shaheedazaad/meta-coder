name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false
      - run: pixi install --locked -e dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Diagnose Windows audit concurrency (temporary)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          for target in (
              'tests/test_provenance.py::test_parallel_operations_keep_requests_separate',
              'tests/test_provenance.py',
          ):
              for iteration in range(20):
                  print(f'{target}: run {iteration + 1}/20', flush=True)
                  subprocess.run(
                      ['pixi', 'run', '--locked', '-e', 'dev', 'pytest', '-s', '-q', target],
                      check=True,
                  )
      - run: pixi run --locked -e dev test
      - run: pixi run --locked -e dev npm test
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,docs]'
      - run: python -m pytest -q tests/test_release_tooling.py
      - run: python -m mkdocs build --strict
